# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Matches the Cloud Run console change of 2026-11-02 (min 1 / max 20).
  # minInstances 1 = no cold start on the first request after idle (billed continuously).
  # Server code keeps no in-process shared state, so >1 instance is safe.
  minInstances: 1
  maxInstances: 20
  # 512MiB (the default) was OOM-killed ~400 times in 7 days (Cloud Run logs,
  # "Memory limit of 512 MiB exceeded"), restarting the only instance every few
  # minutes. Raised to 2GiB on 2026-11-02 and to 4GiB in the Cloud Run console on
  # 2026-11-16 (each instance now keeps an in-memory copy of the ticket summaries for
  # the paged lists). This line must match the console value: every App Hosting
  # rollout applies what is written here.
  memoryMiB: 4096
  cpu: 1

env:
  - variable: NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID
    value: "253572129339-kbebo2gqi9jih3omm3dsafh4cio2uqdc.apps.googleusercontent.com"
    availability:
      - BUILD
      - RUNTIME