# Staging overrides merged on top of apphosting.yaml.
# https://firebase.google.com/docs/app-hosting/multiple-environments
#
# EMAIL_REDIRECT_TO (optional): send every staging email to this one test address instead.
# Without it the staging web app sends no emails at all (src/actions/ticket_share.ts).

env:
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE_ID
    value: staging
    availability:
      - BUILD
      - RUNTIME
